name: Generate Drizzle Migration

on:
  push:
    paths:
      - ".github/workflows/generate-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/murk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate migration
        run: npx drizzle-kit generate

      - name: Commit generated migration
        run: |
          if git status --porcelain -- drizzle | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add drizzle
            git commit -m "chore(db): generate initial Murk migration"
            git push origin HEAD:main
          else
            echo "No migration changes generated"
          fi
