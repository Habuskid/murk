name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_MURK_MAINNET to run the production deployment'
        required: true
        type: string

concurrency:
  group: murk-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_MURK_MAINNET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      PORTAL_AUTH_ENVIRONMENT_ID: ${{ secrets.PORTAL_AUTH_ENVIRONMENT_ID }}
      PORTAL_AUTH_FROM_EMAIL: ${{ secrets.PORTAL_AUTH_FROM_EMAIL }}
      PORTAL_AUTH_TEMPLATE_ID: ${{ secrets.PORTAL_AUTH_TEMPLATE_ID }}
      PORTAL_CUSTODIAN_API_KEY: ${{ secrets.PORTAL_CUSTODIAN_API_KEY }}

      MURK_SESSION_SECRET: ${{ secrets.MURK_SESSION_SECRET }}
      AGENT_WALLET_MASTER_SECRET: ${{ secrets.AGENT_WALLET_MASTER_SECRET }}

      PUBLIC_APP_ORIGIN: ${{ secrets.PUBLIC_APP_ORIGIN }}

      CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
      NEXT_PUBLIC_CELO_RPC_URL: ${{ secrets.NEXT_PUBLIC_CELO_RPC_URL }}
      CELO_CHAIN_ID: "42220"
      CELO_ATTRIBUTION_CODE: ${{ secrets.CELO_ATTRIBUTION_CODE }}

      EXCHANGE_RATE_API_URL: ${{ secrets.EXCHANGE_RATE_API_URL }}

      NEXT_PUBLIC_X402_RESOURCE_URL: ${{ secrets.NEXT_PUBLIC_X402_RESOURCE_URL }}
      X402_PROBE_RESOURCE_URL: ${{ secrets.X402_PROBE_RESOURCE_URL }}
      X402_FACILITATOR_URL: ${{ secrets.X402_FACILITATOR_URL }}

      ENABLE_LOCAL_X402_FIXTURE: "false"
      UI_SANDBOX_MODE: "false"

      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout locked main branch
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify repository tests
        run: npm test

      - name: Verify migration history
        run: npm run db:check

      - name: Production environment preflight
        run: npm run preflight:deploy

      - name: Apply Murk database migration
        run: npm run db:migrate

      - name: Pull Vercel production configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production build
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOYMENT_URL"

      - name: Verify production health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$DEPLOYMENT_URL/api/health" > /tmp/murk-health.json; then
              cat /tmp/murk-health.json
              exit 0
            fi
            sleep 3
          done

          echo "Production health endpoint did not become ready."
          exit 1
