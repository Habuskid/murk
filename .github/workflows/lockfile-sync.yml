name: Lockfile Sync

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/lockfile-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: murk-lockfile-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "murk-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock for x402 testnet seller"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
