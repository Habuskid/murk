name: Murk CI

concurrency:
  group: murk-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, staging/celo-sepolia]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORTAL_AUTH_ENVIRONMENT_ID: "ci-placeholder"
      PORTAL_AUTH_FROM_EMAIL: "ci@example.com"
      PORTAL_AUTH_TEMPLATE_ID: "ci-placeholder"
      PORTAL_CUSTODIAN_API_KEY: "ci-placeholder"
      MURK_SESSION_SECRET: "ci-placeholder-session-secret-32-bytes-minimum"
      CELO_RPC_URL: https://forno.celo.org
      NEXT_PUBLIC_CELO_RPC_URL: https://forno.celo.org
      CELO_CHAIN_ID: "42220"
      NEXT_PUBLIC_CELO_CHAIN_ID: "42220"
      EXCHANGE_RATE_API_URL: https://open.er-api.com/v6/latest/USD
      ENABLE_LOCAL_X402_FIXTURE: "false"
      X402_PROBE_RESOURCE_URL: "https://agent402.tools/api/answer?q=what%20is%20celo"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check database migration history
        run: npm run db:check

      - name: Build
        run: npm run build

      - name: Validate Celo Sepolia network configuration
        env:
          CELO_CHAIN_ID: "11142220"
          CELO_RPC_URL: https://forno.celo-sepolia.celo-testnet.org
        run: |
          npx tsx -e 'import { CELO_CAIP2_NETWORK, CELO_CHAIN_ID, CELO_TOKENS } from "./src/services/celo.ts"; if (CELO_CHAIN_ID !== 11142220 || CELO_CAIP2_NETWORK !== "eip155:11142220" || CELO_TOKENS.USDC?.address.toLowerCase() !== "0x01c5c0122039549ad1493b8220cabedd739bc44e" || CELO_TOKENS.USDT !== null) process.exit(1)'

      - name: Validate Sepolia staging preflight
        if: github.ref == 'refs/heads/staging/celo-sepolia'
        shell: bash
        run: |
          export DATABASE_URL="postgresql://ci:ci@db.murk.invalid/murk"
          export PORTAL_AUTH_ENVIRONMENT_ID="ci-env"
          export PORTAL_AUTH_FROM_EMAIL="ci@murk.invalid"
          export PORTAL_AUTH_TEMPLATE_ID="ci-template"
          export PORTAL_CUSTODIAN_API_KEY="ci-runtime-value"
          export MURK_SESSION_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export AGENT_WALLET_MASTER_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export PUBLIC_APP_ORIGIN="https://staging.murk.invalid"
          export CELO_CHAIN_ID="11142220"
          export NEXT_PUBLIC_CELO_CHAIN_ID="11142220"
          export CELO_RPC_URL="https://forno.celo-sepolia.celo-testnet.org"
          export NEXT_PUBLIC_CELO_RPC_URL="https://forno.celo-sepolia.celo-testnet.org"
          export EXCHANGE_RATE_API_URL="https://open.er-api.com/v6/latest/USD"
          export X402_FACILITATOR_URL="https://api.x402.sepolia.celo.org"
          export ENABLE_LOCAL_X402_FIXTURE="false"
          export UI_SANDBOX_MODE="false"
          unset NEXT_PUBLIC_X402_RESOURCE_URL
          unset X402_PROBE_RESOURCE_URL
          npm run preflight:staging

      - name: Build Sepolia staging variant
        if: github.ref == 'refs/heads/staging/celo-sepolia'
        env:
          CELO_CHAIN_ID: "11142220"
          NEXT_PUBLIC_CELO_CHAIN_ID: "11142220"
          CELO_RPC_URL: https://forno.celo-sepolia.celo-testnet.org
          NEXT_PUBLIC_CELO_RPC_URL: https://forno.celo-sepolia.celo-testnet.org
        run: |
          rm -rf .next
          npm run build

      - name: Check Celo Sepolia x402 facilitator support
        run: |
          curl --fail --silent --show-error https://api.x402.sepolia.celo.org/supported > /tmp/x402-sepolia.json
          grep -q 'eip155:11142220' /tmp/x402-sepolia.json

      - name: Probe external x402 challenge
        run: npm run spike:c

      - name: Inspect external merchant asset choices
        run: npm run spike:d

      - name: Verify live accounting FX coverage
        run: npm run spike:e
