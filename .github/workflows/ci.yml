name: Murk CI

concurrency:
  group: murk-ci-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2ktbXVyay5jbGVyay5hY2NvdW50cy5kZXYk"
      CLERK_SECRET_KEY: "sk_test_ci_placeholder"
      CELO_RPC_URL: https://forno.celo.org
      CELO_CHAIN_ID: "42220"
      EXCHANGE_RATE_API_URL: https://open.er-api.com/v6/latest/USD
      ENABLE_LOCAL_X402_FIXTURE: "false"
      X402_PROBE_RESOURCE_URL: "https://agent402.tools/api/answer?q=what%20is%20celo"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Probe external x402 challenge
        run: npm run spike:c
