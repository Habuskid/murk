name: Murk CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CDP_PROJECT_ID: ci-placeholder
      CELO_RPC_URL: https://forno.celo.org
      CELO_CHAIN_ID: "42220"
      EXCHANGE_RATE_API_URL: https://open.er-api.com/v6/latest/USD
      ENABLE_LOCAL_X402_FIXTURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
