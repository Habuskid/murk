name: Murk CI

concurrency:
  group: murk-ci-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORTAL_AUTH_ENVIRONMENT_ID: "ci-placeholder"
      PORTAL_AUTH_FROM_EMAIL: "ci@example.com"
      PORTAL_AUTH_TEMPLATE_ID: "ci-placeholder"
      PORTAL_CUSTODIAN_API_KEY: "ci-placeholder"
      MURK_SESSION_SECRET: "ci-placeholder-session-secret-32-bytes-minimum"
      CELO_RPC_URL: https://forno.celo.org
      CELO_CHAIN_ID: "42220"
      EXCHANGE_RATE_API_URL: https://open.er-api.com/v6/latest/USD
      ENABLE_LOCAL_X402_FIXTURE: "false"
      X402_PROBE_RESOURCE_URL: "https://agent402.tools/api/answer?q=what%20is%20celo"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Probe external x402 challenge
        run: npm run spike:c

      - name: Inspect external merchant asset choices
        run: npm run spike:d
